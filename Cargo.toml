[workspace]
members = [
    "crates/folk-around",
    "crates/folk-computer-use",
    "crates/folk-core",
    "crates/folk-mcp",
    "crates/folk-transport",
]
resolver = "3"

[workspace.package]
version = "0.3.4"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/undivisible/folk-around"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
hkdf = "0.12"
rand = "0.9"
rs_peekaboo = "0.2.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
