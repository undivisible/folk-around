[workspace]
members = [
    "crates/folk-around",
    "crates/folk-computer-use",
    "crates/folk-core",
    "crates/folk-mcp",
    "crates/folk-transport",
    "crates/folk-zig-legacy",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/undivisible/folk-around"

[workspace.dependencies]
base64 = "0.22"
cc = "1.2"
chacha20poly1305 = "0.10"
equilibrium-ffi = { path = "../equilibrium" }
hex = "0.4"
hkdf = "0.12"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
