name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_cargo: ${{ steps.rust-manifest.outputs.has_cargo }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Detect Rust manifest
        id: rust-manifest
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

  rust-cli:
    needs: detect
    if: ${{ needs.detect.outputs.has_cargo == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: folk-around-darwin-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: folk-around-darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: folk-around-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: folk-around-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build Rust CLI
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Rust CLI
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/folk-around dist/${{ matrix.asset }}

      - name: Upload Rust CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  zig-cli:
    needs: detect
    if: ${{ needs.detect.outputs.has_cargo != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Build Zig CLI assets
        run: |
          mkdir -p dist
          zig build -Dtarget=aarch64-macos -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-darwin-aarch64
          zig build -Dtarget=x86_64-macos -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-darwin-x86_64
          zig build -Dtarget=aarch64-linux -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-linux-aarch64
          zig build -Dtarget=x86_64-linux -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-linux-x86_64

      - name: Upload Zig CLI
        uses: actions/upload-artifact@v4
        with:
          name: zig-cli
          path: |
            dist/folk-around-darwin-aarch64
            dist/folk-around-darwin-x86_64
            dist/folk-around-linux-aarch64
            dist/folk-around-linux-x86_64

  zig-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Build Zig app
        run: |
          mkdir -p dist
          zig build -Dapp -Doptimize=ReleaseFast
          cp zig-out/bin/FolkAround dist/FolkAround-darwin

      - name: Upload Zig app
        uses: actions/upload-artifact@v4
        with:
          name: FolkAround-darwin
          path: dist/FolkAround-darwin

  release:
    needs:
      - rust-cli
      - zig-cli
      - zig-app
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/folk-around-darwin-aarch64
            dist/folk-around-darwin-x86_64
            dist/folk-around-linux-aarch64
            dist/folk-around-linux-x86_64
            dist/FolkAround-darwin
          tag_name: ${{ github.ref_name }}
