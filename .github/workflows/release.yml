name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build binaries
        run: |
          mkdir -p dist
          zig build -Dtarget=aarch64-macos -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-darwin-aarch64
          zig build -Dtarget=x86_64-macos -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-darwin-x86_64
          zig build -Dtarget=aarch64-linux -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-linux-aarch64
          zig build -Dtarget=x86_64-linux -Doptimize=ReleaseFast
          cp zig-out/bin/folk-around dist/folk-around-linux-x86_64
          zig build -Dapp -Doptimize=ReleaseFast
          cp zig-out/bin/FolkAround dist/FolkAround-darwin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/folk-around-darwin-aarch64
            dist/folk-around-darwin-x86_64
            dist/folk-around-linux-aarch64
            dist/folk-around-linux-x86_64
            dist/FolkAround-darwin
          tag_name: ${{ github.ref_name }}
