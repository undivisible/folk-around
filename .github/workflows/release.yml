name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        run: cargo test --all-features --locked

      - name: Rust build
        run: cargo build --release --locked

  signal-server-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: canary

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: signal-server

      - name: Format
        run: bun run format
        working-directory: signal-server

      - name: Lint
        run: bun run lint
        working-directory: signal-server

      - name: Typecheck
        run: bun run typecheck
        working-directory: signal-server

      - name: Test
        run: bun test
        working-directory: signal-server

      - name: Build
        run: bun run build
        working-directory: signal-server

  rust-cli:
    needs:
      - rust-quality
      - signal-server-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: folk-around-darwin-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: folk-around-darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: folk-around-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: folk-around-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build Rust CLI
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage Rust CLI
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/folk-around dist/${{ matrix.asset }}

      - name: Upload Rust CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs:
      - rust-cli
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/folk-around-darwin-aarch64
            dist/folk-around-darwin-x86_64
            dist/folk-around-linux-aarch64
            dist/folk-around-linux-x86_64
          tag_name: ${{ github.ref_name }}
