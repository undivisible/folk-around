name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Detect Rust manifest
        id: rust-manifest
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rust format
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo fmt --all -- --check

      - name: Rust lint
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo test --all-features --locked

      - name: Rust build
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo build --release --locked

      - name: Install Rust audit tools
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        continue-on-error: true
        run: cargo install cargo-audit cargo-deny --locked

      - name: Rust audit
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        continue-on-error: true
        run: cargo audit

      - name: Rust dependency policy
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        continue-on-error: true
        run: cargo deny check

      - name: Install script test
        run: bash scripts/test-install.sh

  signal-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: canary

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: signal-server

      - name: Format
        run: bun run format
        working-directory: signal-server

      - name: Lint
        run: bun run lint
        working-directory: signal-server

      - name: Typecheck
        run: bun run typecheck
        working-directory: signal-server

      - name: Test
        run: bun test
        working-directory: signal-server

      - name: Build
        run: bun run build
        working-directory: signal-server
