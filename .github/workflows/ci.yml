name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Detect Rust manifest
        id: rust-manifest
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout equilibrium
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: git clone --depth 1 https://github.com/tschk/equilibrium ../equilibrium

      - name: Install Zig
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Rust format
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo fmt --all -- --check

      - name: Rust lint
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo test --all-features

      - name: Rust build
        if: ${{ steps.rust-manifest.outputs.has_cargo == 'true' }}
        run: cargo build --release

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Check Zig format
        run: zig fmt --check build.zig src/*.zig

      - name: Build CLI
        run: zig build -Doptimize=ReleaseFast

      - name: Build App
        run: zig build -Dapp -Doptimize=ReleaseFast

      - name: Run tests
        run: zig build test

  signal-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: canary

      - name: Install Dependencies
        run: bun install
        working-directory: signal-server

      - name: Format
        run: bun run format
        working-directory: signal-server

      - name: Lint
        run: bun run lint
        working-directory: signal-server

      - name: Typecheck
        run: bun run typecheck
        working-directory: signal-server

      - name: Test
        run: bun test
        working-directory: signal-server

      - name: Build
        run: bun run build
        working-directory: signal-server
