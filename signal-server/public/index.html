<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Folk Around signalling helps local MCP agents find peers."
    />
    <title>Folk Around Signalling</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f3;
        --text: #191b18;
        --muted: #5e655d;
        --border: #d9ddd5;
        --ok: #257b3e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111311;
          --text: #f2f2ed;
          --muted: #a9afa7;
          --border: #31362f;
          --ok: #79d489;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(680px, calc(100% - 2rem));
        padding: 4rem 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        min-height: 2rem;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: var(--muted);
      }

      .dot[data-state="ok"] {
        background: var(--ok);
      }

      h1 {
        margin: 1.1rem 0 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
        font-weight: 650;
      }

      p {
        max-width: 42rem;
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.65;
      }

      nav {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }

      a {
        color: var(--text);
        text-underline-offset: 0.22em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status" aria-live="polite">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">checking status</span>
      </div>
      <h1>Folk Around Signalling</h1>
      <p>
        Hosted signalling for Folk Around. It lets local MCP agents join a
        pairing room and exchange peer messages without hosting the computer
        control daemon here.
      </p>
      <nav>
        <a href="/health">Health</a>
        <a href="https://github.com/undivisible/folk-around">GitHub</a>
      </nav>
    </main>
    <script>
      const dot = document.getElementById("status-dot");
      const text = document.getElementById("status-text");

      fetch("/health")
        .then((response) => {
          if (!response.ok) throw new Error("health failed");
          return response.json();
        })
        .then((health) => {
          if (health.ok) {
            dot?.setAttribute("data-state", "ok");
            if (text) text.textContent = "online";
          }
        })
        .catch(() => {
          if (text) text.textContent = "status unavailable";
        });
    </script>
  </body>
</html>
