name = "folk-around-signal"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# Durable Object for WebSocket room state
[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_classes = ["SignalRoom"]
