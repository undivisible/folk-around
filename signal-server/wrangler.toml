name = "folk-around-signal"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "folkaround.undivisible.dev"
custom_domain = true

# Durable Object for WebSocket room state
[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_classes = ["SignalRoom"]
